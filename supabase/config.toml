# Raíz del proyecto Supabase de NEXUS.
# Sin este archivo la CLI sube directorios buscando otro config.toml
# (había uno en C:\Users\pague\supabase con una send-push vacía) y despliega lo que no es.
project_id = "nexus"

[functions.send-push]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-push/index.ts"

# La llama el cron de GitHub con x-cron-secret, sin sesión de usuario
[functions.daily-reminder]
enabled = true
verify_jwt = false
entrypoint = "./functions/daily-reminder/index.ts"
