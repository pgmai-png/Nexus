# Supabase (plan gratuito) pausa el proyecto tras ~7 días sin actividad.
# Esto hace una consulta mínima cada 3 días para mantenerlo activo.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a rpc/keepalive
        env:
          SUPABASE_URL: https://wusqkenwwxaglpifrhtf.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "HTTP $code"
          test "$code" = "200"
